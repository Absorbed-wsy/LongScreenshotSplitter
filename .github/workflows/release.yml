name: Build and release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create virtual environment' }
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Run core and GUI regression tests
        run: |
          .\.venv\Scripts\python.exe -m unittest -v test_splitter.py test_gui.py
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = & .\.venv\Scripts\python.exe -c "from main import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version must match' }
          if (-not (Test-Path "docs/releases/$env:GITHUB_REF_NAME.md")) { throw 'Release notes are missing' }
      - name: Build Windows executable
        run: |
          .\build.bat
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Verify packaged executable and prepare checksums
        run: .\verify-release.ps1
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag "dist/LongScreenshotSplitter-$tag-windows-x64.exe" dist/SHA256SUMS.txt dist/self-test.json --verify-tag --draft --title "长截图切分器 $tag" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; the draft remains available' }
